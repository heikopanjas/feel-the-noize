name: FeelTheNoize

options:
  bundleIdPrefix: com.panjas
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 8J2G689FCZ
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  FeelTheNoize:
    type: application
    platform: macOS
    sources:
      - path: Sources/FeelTheNoize
    # Keys Xcode has no INFOPLIST_KEY_ build setting for; merged with the generated Info.plist.
    info:
      path: Configuration/FeelTheNoize-Info.plist
      properties:
        NSAudioCaptureUsageDescription: Feel the Noize changes the volume of audio devices without volume control by adjusting the audio sent to them.
        NSBluetoothAlwaysUsageDescription: Feel the Noize reads the battery level of your Surface Dial over Bluetooth.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.FeelTheNoize
        PRODUCT_NAME: "Feel the Noize"
        PRODUCT_MODULE_NAME: FeelTheNoize
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feel the Noize
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Heiko Panjas. All rights reserved."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - FeelTheNoizeTests

  FeelTheNoizeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FeelTheNoizeTests
    dependencies:
      - target: FeelTheNoize
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.FeelTheNoizeTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives the host from the target name, but the app's product name has spaces.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Feel the Noize.app/Contents/MacOS/Feel the Noize"
