name: Manopola

options:
  bundleIdPrefix: com.panjas
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 8J2G689FCZ
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Manopola:
    type: application
    platform: macOS
    sources:
      - path: Sources/Manopola
    # Keys Xcode has no INFOPLIST_KEY_ build setting for; merged with the generated Info.plist.
    info:
      path: Configuration/Manopola-Info.plist
      properties:
        NSAudioCaptureUsageDescription: Manopola changes the volume of audio devices without volume control by adjusting the audio sent to them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.Manopola
        PRODUCT_NAME: Manopola
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Manopola
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Heiko Panjas. All rights reserved."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - ManopolaTests

  ManopolaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ManopolaTests
    dependencies:
      - target: Manopola
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.ManopolaTests
        GENERATE_INFOPLIST_FILE: YES
